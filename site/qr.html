<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR-код сайта — Рынок у отеля</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #fff; color: #1f1f1f; font: 20px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 34px; line-height: 1.15; }
    .lead { margin: 0 0 20px; color: #444; }
    .qr { display: block; width: min(100%, 420px); height: auto; margin: 0 auto 16px; image-rendering: pixelated; }
    .url { margin: 0 0 8px; font-size: 26px; font-weight: 700; word-break: break-all; }
    .hint { margin: 0 0 24px; color: #444; }
    .actions { display: grid; gap: 12px; max-width: 360px; margin: 0 auto; }
    .btn { display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 10px 20px; border: 2px solid #1e7a46; border-radius: 12px; background: #1e7a46; color: #fff; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    .btn--alt { background: #fff; color: #145a32; }
    @media print {
      .actions { display: none; }
      main { padding-top: 0; }
      @page { margin: 12mm; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Рынок у отеля</h1>
    <p class="lead">Фрукты, ром и другие товары с доставкой в отель. Наведите камеру телефона на код: откроется каталог.</p>
    <img class="qr" src="img/qr-site.svg" alt="QR-код со ссылкой на сайт Рынок у отеля" width="420" height="420">
    <p class="url">nhatrang-rynok.github.io</p>
    <p class="hint">Можно открыть и без кода: введите адрес в браузере.</p>
    <div class="actions">
      <button class="btn" type="button" onclick="window.print()">Распечатать</button>
      <a class="btn btn--alt" href="img/qr-site.png" download="qr-rynok-u-otelya.png">Скачать картинку (PNG)</a>
    </div>
  </main>
</body>
</html>
