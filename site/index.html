<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рынок у отеля</title>
  <meta name="description" content="Фрукты, ром и другие товары с местного рынка и из аптеки с доставкой в отель. Выберите товары и оставьте телефон — мы свяжемся с вами.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1E7A46">
  <meta name="color-scheme" content="light">

  <!-- Превью ссылки в WhatsApp и Telegram. Адрес картинки абсолютный: при смене адреса сайта обновить og:url и og:image -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="Рынок у отеля">
  <meta property="og:title" content="Рынок у отеля">
  <meta property="og:description" content="Фрукты, ром, сладости и другие товары с рынка. Привезём в отель.">
  <meta property="og:url" content="https://nhatrang-rynok.github.io/">
  <meta property="og:image" content="https://nhatrang-rynok.github.io/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Рынок у отеля: фрукты, ром и другие товары с доставкой в отель">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="icon" href="img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#app">К содержимому</a>

  <header class="app-header" id="app-header">
    <button class="icon-btn back-btn" id="back-btn" type="button" aria-label="Назад" hidden>
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false"><path d="M15 4.5 7.5 12 15 19.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="app-header__title" id="header-title">Рынок у отеля</div>
    <a class="icon-btn" id="orders-link" href="#/orders" aria-label="Мои заказы">
      <span aria-hidden="true">📦</span>
      <span class="cart-link__count orders-count" id="orders-count" aria-live="polite" hidden>0</span>
    </a>
    <a class="icon-btn cart-link" id="cart-link" href="#/cart" aria-label="Корзина">
      <span aria-hidden="true">🛒</span>
      <span class="cart-link__count" id="cart-count" aria-live="polite" hidden>0</span>
    </a>
  </header>

  <main class="app-main" id="app" tabindex="-1">
    <noscript><p class="notice">Для работы сайта нужен включённый JavaScript.</p></noscript>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" id="modal-close" type="button" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>
      </button>
      <div class="modal__body" id="modal-body"></div>
    </div>
  </div>

  <nav class="cart-bar" id="cart-bar" aria-label="Корзина" hidden>
    <a class="btn btn--primary btn--block" href="#/cart" id="cart-bar-link">Корзина</a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
